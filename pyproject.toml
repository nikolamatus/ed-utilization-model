[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ed-utilization-model"
version = "0.1.0"
description = "Reproducible longitudinal ED-utilization feasibility pipeline (AHRQ MEPS public data)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["feasibility*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
